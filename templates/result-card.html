<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>天演成果卡片</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; padding: 40px; background: #f7f7f2; color: #1a1a1a; }
  .card { max-width: 760px; margin: 0 auto; background: #fff; border: 1px solid #e2e2d8; border-radius: 12px; padding: 36px 40px; box-shadow: 0 4px 20px rgba(0,0,0,.06); }
  .head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid #1a1a1a; padding-bottom: 12px; margin-bottom: 20px; }
  .head h1 { font-size: 22px; margin: 0; }
  .head .date { font-size: 13px; color: #888; }
  .score-row { display: flex; gap: 24px; align-items: center; margin: 20px 0; }
  .score-box { flex: 1; text-align: center; padding: 18px; background: #f3f3ec; border-radius: 10px; }
  .score-box .num { font-size: 40px; font-weight: 700; }
  .score-box .label { font-size: 13px; color: #777; margin-top: 4px; }
  .arrow { font-size: 28px; color: #999; }
  .delta { font-size: 20px; font-weight: 700; color: #1a8a4f; }
  table { width: 100%; border-collapse: collapse; margin: 18px 0; font-size: 14px; }
  th, td { border-bottom: 1px solid #eee; padding: 8px 10px; text-align: left; }
  th { color: #777; font-weight: 500; }
  .bar { background: #e8e8e0; border-radius: 6px; height: 14px; position: relative; }
  .bar i { display: block; height: 14px; border-radius: 6px; background: #2b6cb0; }
  .footer { margin-top: 24px; padding-top: 14px; border-top: 1px solid #eee; font-size: 13px; color: #888; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <h1>🌱 天演进化卡片 · {{SKILL_NAME}}</h1>
    <div class="date">{{DATE}}</div>
  </div>
  <div class="score-row">
    <div class="score-box"><div class="num">{{SCORE_BEFORE}}</div><div class="label">优化前</div></div>
    <div class="arrow">→</div>
    <div class="score-box"><div class="num">{{SCORE_AFTER}}</div><div class="label">优化后</div></div>
    <div class="delta">{{DELTA}}</div>
  </div>
  <table>
    <tr><th>维度</th><th style="width:60%">变化</th></tr>
    {{DIM_BARS}}
  </table>
  <p style="font-size:14px; color:#555; margin:16px 0 4px;"><b>本轮改进摘要</b></p>
  <ul style="font-size:14px; color:#444; margin:0 0 8px; padding-left:20px;">
    {{SUMMARY_ITEMS}}
  </ul>
  <p style="font-size:13px; color:#999; margin:4px 0 0;">门控记录：{{GATE_LOG}}</p>
  <div class="footer">
    <span>Train your skills like you train your models.</span>
    <span>天演 · TianYan Evolution</span>
  </div>
</div>
</body>
</html>
